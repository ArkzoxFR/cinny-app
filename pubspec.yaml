name: cinny_app
description: Client Cinny (Matrix) — Android / iOS / Windows, avec configuration serveur pilotable à distance depuis GitHub.
publish_to: 'none'
version: 1.3.2+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView unique pour Android, iOS, Windows (WebView2), macOS, Linux.
  # Version 6.2.0-beta.x requise (pas 6.1.5) : c'est la seule qui corrige la
  # compatibilité avec l'Android Gradle Plugin 9 (sinon le build Android
  # échoue sur flutter_inappwebview_android / proguard-android.txt).
  flutter_inappwebview: ^6.2.0-beta.3

  # Stockage local de l'URL choisie par l'utilisateur au premier lancement.
  shared_preferences: ^2.3.2

  # Appels réseau pour aller chercher le fichier de config distant sur GitHub.
  http: ^1.2.2

  # Utile pour afficher la version de l'app dans un écran de debug/à propos,
  # et pour comparer la version installée à la dernière version publiée.
  package_info_plus: ^8.0.0

  # Windows uniquement : icône dans la barre des tâches, fermeture vers le
  # tray au lieu de quitter, et notifications natives pour le flux de MAJ.
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  local_notifier: ^0.1.6

  # Badge et clignotement sur le bouton de la barre des tâches Windows
  # (overlay icon + FlashWindowEx), à la façon de Teams.
  windows_taskbar: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Toutes les variantes d'icône tray : thème clair/sombre × pastille de
    # messages non lus (aucune, 1 à 9, 9+).
    - assets/
